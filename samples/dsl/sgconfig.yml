ruleDirs:
  - rules
customLanguages:
  calc:
    # Prebuilt .interp so CI / machines without tools/antlr-*.jar still work.
    # Regenerate from .g4 when editing the grammar:
    #   java -jar tools/antlr-4.13.2-complete.jar -Dlanguage=CSharp -Xexact-output-dir -o samples/dsl \
    #     samples/dsl/CalcLexer.g4 samples/dsl/CalcParser.g4
    grammar:
      - CalcLexer.interp
      - CalcParser.interp
    extensions:
      - calc
    startRule: program
    # Most specific first: patterns are compiled with the first rule that parses them, and
    # `program` would match a whole file's statement list rather than a single statement.
    patternRules:
      - statement
      - expr
      - program
    metaVarPlaceholder: "__MV{0}__"
    ignoreCase: false
