name: Format

on:
  push:
  pull_request:
  workflow_call:

concurrency:
  group: format-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  csharpier:
    name: CSharpier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore local tools
        run: dotnet tool restore
      - name: Check C# / XML formatting
        run: dotnet csharpier check .
      - name: Hint on failure
        if: failure()
        run: |
          echo "::notice::Fix locally with: dotnet tool restore && dotnet csharpier format ."

  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Check YAML / JSON / Markdown formatting
        run: npx prettier --check .
      - name: Hint on failure
        if: failure()
        run: |
          echo "::notice::Fix locally with: npx prettier --write ."

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        uses: rhysd/actionlint@v1
        with:
          args: -color
