name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build artifacts without publishing"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_prerelease: ${{ steps.v.outputs.is_prerelease }}
    steps:
      - id: v
        shell: bash
        run: |
          REF="${{ github.ref_name }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            REF="0.0.0-dev"
          fi
          VER="${REF#v}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if [[ "$VER" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  format:
    needs: version
    uses: ./.github/workflows/format.yml

  test:
    needs: version
    uses: ./.github/workflows/ci.yml

  binaries:
    needs: [version, format, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            archive: zip
          - os: ubuntu-latest
            rid: linux-x64
            archive: tar.gz
          - os: macos-latest
            rid: osx-arm64
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install Linux AOT deps
        if: matrix.rid == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Publish AOT
        run: >
          dotnet publish src/AstGrepAntlr.Cli/AstGrepAntlr.Cli.csproj
          -c Release -r ${{ matrix.rid }}
          -p:PublishAot=true
          -p:Version=${{ needs.version.outputs.version }}
          -o artifacts/${{ matrix.rid }}
      - name: Smoke test
        shell: bash
        env:
          AG4_SMOKE_PATTERN: "foo($$$ARGS)"
        run: |
          BIN=artifacts/${{ matrix.rid }}/ag4
          if [[ "${{ matrix.rid }}" == win-x64 ]]; then BIN=artifacts/${{ matrix.rid }}/ag4.exe; fi
          "$BIN" version
          mkdir -p /tmp/ag4-smoke
          printf '%s\n' 'class T { void M() { foo(1); } }' > /tmp/ag4-smoke/Sample.cs
          "$BIN" run -l csharp -p "$AG4_SMOKE_PATTERN" /tmp/ag4-smoke | grep -q foo
          printf '%s\n' 'class T { void m() { foo(1); } }' > /tmp/ag4-smoke/Sample.java
          "$BIN" run -l java --backend tree-sitter -p "$AG4_SMOKE_PATTERN" /tmp/ag4-smoke | grep -q foo
          ls "$BIN"* >/dev/null
          # tree-sitter natives must ship beside the binary (runtimes/<rid>/native or same dir)
          find "$(dirname "$BIN")" -name '*tree-sitter*' | head -n 5 | grep -q tree-sitter
      - name: Pack archive
        shell: bash
        run: |
          VER="${{ needs.version.outputs.version }}"
          cd artifacts/${{ matrix.rid }}
          if [[ "${{ matrix.archive }}" == zip ]]; then
            7z a ../ag4-${VER}-${{ matrix.rid }}.zip .
          else
            tar -czf ../ag4-${VER}-${{ matrix.rid }}.tar.gz .
          fi
          cd ..
          if command -v sha256sum >/dev/null; then
            sha256sum ag4-${VER}-${{ matrix.rid }}.* > ag4-${VER}-${{ matrix.rid }}.sha256
          else
            shasum -a 256 ag4-${VER}-${{ matrix.rid }}.* > ag4-${VER}-${{ matrix.rid }}.sha256
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.rid }}
          path: artifacts/ag4-*

  packages:
    needs: [version, format, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore AstGrepAntlr.slnx
      - run: >
          dotnet pack AstGrepAntlr.slnx -c Release
          -p:Version=${{ needs.version.outputs.version }}
          -o artifacts/nupkg
      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/nupkg/*.nupkg

  github-release:
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run == false
    needs: [version, binaries, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VER="${{ needs.version.outputs.version }}"
          PRE=""
          if [[ "${{ needs.version.outputs.is_prerelease }}" == "true" ]]; then PRE="--prerelease"; fi
          gh release create "v${VER}" dist/ag4-* dist/*.nupkg \
            --title "v${VER}" \
            --generate-notes \
            $PRE

  nuget:
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run == false
    needs: [version, packages, github-release]
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: nupkg
          path: nupkg
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        shell: bash
        run: |
          if [[ -z "${NUGET_API_KEY}" ]]; then
            echo "NUGET_API_KEY not set; skip push (configure Trusted Publishing or secret)."
            exit 0
          fi
          dotnet nuget push nupkg/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
