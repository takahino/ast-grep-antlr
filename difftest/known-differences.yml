    category: matcher
    reason: Residual only-ag4 from ag4 call / attribute matching differences.
    bucket: OnlyAg4

  - id: ts-python-range-matcher
    language: python
    backend: tree-sitter
    category: matcher
    reason: Occasional range-diff residuals under tree-sitter-python.
    bucket: RangeDiff

  - id: ts-csharp-metavar-matcher
    language: csharp
    backend: tree-sitter
    category: matcher
    reason: >
      Residual metavar-diff under tree-sitter-c-sharp vs upstream (casts, lambdas,
      is-patterns, argument lists) after multi-JSON alignment.
    bucket: MetaVarDiff

  - id: ts-csharp-only-ast-grep-matcher
    language: csharp
