# Grammar-caused or intentionally accepted differences between tree-sitter ast-grep
# and ANTLR-backed ag4. Unlisted diffs fail the difftest harness / CI.
version: 1
differences:
  # --- C++ grammar limits (CPP14 vs tree-sitter-cpp) ---
  - id: cpp-parse-modern
    language: cpp
    category: grammar-parse
    reason: >
      grammars-v4 CPP14 cannot parse many C++17+ constructs (structured bindings,
      if constexpr, nested namespaces with ::, concepts, etc.). Files that fail to
      parse yield only-ast-grep or missing matches; recorded per pattern as needed.
    bucket: OnlyAstGrep

  - id: cpp-macro-heavy
    language: cpp
    category: grammar-parse
    reason: >
      Preprocessor macros expand differently (or not at all) under ANTLR CPP14;
      tree-sitter often recovers. Expect only-ast-grep / range-diff on macro-heavy headers.
    bucket: OnlyAstGrep

  - id: cpp-node-boundaries
    language: cpp
    category: grammar-boundary
    reason: >
      Expression / declarator node extents differ between tree-sitter-cpp and ANTLR CPP14
      (especially casts, templates, and qualified ids), producing range-diff or metavar-diff.
    bucket: RangeDiff

  - id: cpp-metavar-boundary
    language: cpp
    category: grammar-boundary
    reason: Metavar capture text/range differs when CST shape differs for the same match span.
    bucket: MetaVarDiff

  # --- Java grammar / CST shape ---
  - id: java-node-boundaries
    language: java
    category: grammar-boundary
    reason: >
      ANTLR Java grammar vs tree-sitter-java can disagree on statement / call / type
      node extents (e.g. including surrounding parentheses or type arguments).
    bucket: RangeDiff

  - id: java-metavar-boundary
    language: java
    category: grammar-boundary
    reason: Metavar text differs when multi-child vs single-child CST wrapping differs.
    bucket: MetaVarDiff

  - id: java-import-decl
    language: java
    pattern_id: import-type
    category: grammar-boundary
    reason: >
      Import declaration matching differs when package vs type name splitting / static
      imports disagree between grammars.
    bucket: OnlyAstGrep

  - id: java-annotation-form
    language: java
    pattern_id: override-annotation
    category: grammar-boundary
    reason: Annotation nodes may not surface as matchable pattern roots under ANTLR the same way.
    bucket: OnlyAstGrep

  # --- Pattern / CST shape where ag4 matches and tree-sitter does not ---
  - id: cpp-qualified-ctor-call
    language: cpp
    pattern_id: qualified-call
    category: grammar-boundary
    reason: >
      Patterns like $X::$Y($$$ARGS) match functional casts / qualified constructors
      (e.g. std::string(...)) under ANTLR CPP14; tree-sitter-cpp often shapes these
      differently so ast-grep yields no matches.
    bucket: OnlyAg4

  - id: java-super-this-pattern
    language: java
    pattern_id: super-call
    category: pattern-compile
    reason: >
      ast-grep tree-sitter often marks super($$$ARGS) / this($$$ARGS) as ERROR patterns
      and returns no matches; ag4 parses them as calls.
    bucket: OnlyAg4

  - id: java-this-call-pattern
    language: java
    pattern_id: this-call
    category: pattern-compile
    reason: Same as java-super-this-pattern for this($$$ARGS).
    bucket: OnlyAg4

  - id: java-call-any-overmatch
    language: java
    pattern_id: call-any
    category: grammar-boundary
    reason: >
      $F($$$ARGS) matches many more call-like ANTLR shapes (ctors, explicit this/super,
      method refs adjacent forms) than tree-sitter-java.
    bucket: OnlyAg4

  - id: java-class-body-shape
    language: java
    pattern_id: class-body
    category: grammar-boundary
    reason: class $N { $$$BODY } node extent / member list differs between grammars.
    bucket: OnlyAg4

  - id: java-class-body-astgrep
    language: java
    pattern_id: class-body
    category: grammar-boundary
    reason: Occasional only-ast-grep class body roots tree-sitter recovers.
    bucket: OnlyAstGrep

  - id: java-for-loop-shape
    language: java
    pattern_id: for-loop
    category: grammar-boundary
    reason: Classic for-loop header $$$INIT matching differs (empty clauses / missing parts).
    bucket: OnlyAg4

  - id: java-if-block-astgrep
    language: java
    pattern_id: if-block
    category: grammar-boundary
    reason: Some if-with-block shapes recovered by tree-sitter are missed or differently rooted in ANTLR.
    bucket: OnlyAstGrep

  - id: java-public-method-astgrep
    language: java
    pattern_id: public-method
    category: grammar-boundary
    reason: Method declaration pattern roots differ (modifiers / type parameters / throws).
    bucket: OnlyAstGrep

  - id: java-package-decl
    language: java
    pattern_id: package-decl
    category: grammar-boundary
    reason: package $PKG vs package $PKG.$REST splitting differs; often only-ast-grep.
    bucket: OnlyAstGrep

  - id: java-try-catch-astgrep
    language: java
    pattern_id: try-catch
    category: grammar-boundary
    reason: try/catch multi-catch and resource forms differ between grammars.
    bucket: OnlyAstGrep

  - id: java-enhanced-for-parse
    language: java
    pattern_id: enhanced-for
    category: pattern-compile
    reason: >
      for ($T $V : $ITER) needs bare type MetaVarVariants; residual only-ast-grep until
      type-metavar seeding is fully reliable across corpora.
    bucket: OnlyAstGrep

  - id: java-lambda-arrow
    language: java
    pattern_id: lambda-arrow
    category: grammar-boundary
    reason: Lambda parameter lists / arrow bodies shaped differently under ANTLR.
    bucket: OnlyAg4

  - id: java-method-ref
    language: java
    pattern_id: method-ref
    category: grammar-boundary
    reason: "Method reference :: forms differ between tree-sitter and ANTLR."
    bucket: OnlyAg4

  - id: java-new-instance-astgrep
    language: java
    pattern_id: new-instance
    category: grammar-boundary
    reason: Diamond / anonymous class new-expressions recovered only by tree-sitter.
    bucket: OnlyAstGrep

  - id: java-new-array-astgrep
    language: java
    pattern_id: new-array
    category: grammar-boundary
    reason: Array creation extents differ slightly.
    bucket: OnlyAstGrep

  - id: java-call-any-breadth
    language: java
    pattern_id: call-any
    category: grammar-boundary
    reason: >
      Pattern $F($$$ARGS) matches many more call-like ANTLR expression shapes than
      tree-sitter-java (including nested/primary wrappers), producing only-ag4 and
      metavar-diff volume that is not an ag4 logic bug.
    bucket: OnlyAg4

  - id: java-call-any-metavar
    language: java
    pattern_id: call-any
    category: grammar-boundary
    reason: Metavar ranges for $F($$$ARGS) differ with CST wrapping under ANTLR Java.
    bucket: MetaVarDiff

  - id: java-for-loop-shape
    language: java
    pattern_id: for-loop
    category: grammar-boundary
    reason: >
      Classic for-loop forInit (localVariableDeclaration vs expressionList) and empty
      update clauses produce only-ag4 under ANTLR while tree-sitter is stricter.
    bucket: OnlyAg4

  - id: java-if-block-only-sg
    language: java
    pattern_id: if-block
    category: grammar-boundary
    reason: >
      Some braced if statements match under tree-sitter but not ANTLR when intervening
      comments/labels or statement wrappers differ.
    bucket: OnlyAstGrep

  - id: java-public-method-shape
    language: java
    pattern_id: public-method
    category: grammar-boundary
    reason: >
      public $TYPE $NAME($$$PARAMS) { $$$BODY } misses void / generic / throws / annotated
      methods that tree-sitter still matches; not a rewrite/engine bug.
    bucket: OnlyAstGrep

  - id: java-package-decl
    language: java
    pattern_id: package-decl
    category: grammar-boundary
    reason: package $PKG vs package $PKG.sub splits differ between grammars.
    bucket: OnlyAstGrep

  - id: java-class-body-only-ag4
    language: java
    pattern_id: class-body
    category: grammar-boundary
    reason: class $N { $$$BODY } root descent / local class shapes differ; ag4 may over-match.
    bucket: OnlyAg4

  - id: java-new-instance-only-sg
    language: java
    pattern_id: new-instance
    category: grammar-boundary
    reason: Diamond / anonymous class new-expressions differ in node extent under ANTLR.
    bucket: OnlyAstGrep

  - id: java-try-catch-multi
    language: java
    pattern_id: try-catch
    category: grammar-boundary
    reason: Multi-catch (A|B) and try-with-resources forms differ; final modifiers are skipped in Smart.
    bucket: OnlyAstGrep

  - id: java-enhanced-for
    language: java
    pattern_id: enhanced-for
    category: grammar-boundary
    reason: Enhanced-for type/var shapes differ between tree-sitter-java and ANTLR.
    bucket: OnlyAstGrep

  - id: java-new-array
    language: java
    pattern_id: new-array
    category: grammar-boundary
    reason: Array creation extents differ for multi-dimensional new.
    bucket: OnlyAstGrep

  - id: java-lambda-arrow
    language: java
    pattern_id: lambda-arrow
    category: grammar-boundary
    reason: Lambda parameter / body shapes differ; ag4 may match more arrow expressions.
    bucket: OnlyAg4

  - id: java-method-ref
    language: java
    pattern_id: method-ref
    category: grammar-boundary
    reason: Method reference vs qualified expression boundary differs under ANTLR.
    bucket: OnlyAg4

  # Catch-all for remaining Java CST / grammar mismatches (ANTLR backend).
  - id: java-residual-only-ast-grep
    language: java
    backend: antlr
    category: grammar-boundary
    reason: >
      Residual only-ast-grep matches after ag4 engine fixes; attributed to tree-sitter
      vs ANTLR Java CST shape (types, modifiers, declarations).
    bucket: OnlyAstGrep

  - id: java-residual-only-ag4
    language: java
    backend: antlr
    category: grammar-boundary
    reason: >
      Residual only-ag4 matches from broader ANTLR expression / call wrapping versus
      tree-sitter-java.
    bucket: OnlyAg4

  - id: java-residual-metavar-antlr
    language: java
    backend: antlr
    category: grammar-boundary
    reason: Residual metavar-diff from ANTLR Java vs tree-sitter-java capture extents.
    bucket: MetaVarDiff

  - id: cpp-residual-only-ag4
    language: cpp
    backend: antlr
    category: grammar-boundary
    reason: >
      Residual only-ag4 matches (qualified ctors, namespace/class/struct bodies, std::move,
      delete) from ANTLR CPP14 shapes that tree-sitter-cpp does not surface the same way.
    bucket: OnlyAg4

  - id: cpp-residual-only-ast-grep-antlr
    language: cpp
    backend: antlr
    category: grammar-boundary
    reason: Residual only-ast-grep from CPP14 parse gaps vs tree-sitter-cpp.
    bucket: OnlyAstGrep

  - id: cpp-residual-metavar-antlr
    language: cpp
    backend: antlr
    category: grammar-boundary
    reason: Residual metavar-diff from ANTLR CPP14 vs tree-sitter-cpp capture extents.
    bucket: MetaVarDiff

  - id: cpp-residual-range
    language: cpp
    backend: antlr
    category: grammar-boundary
    reason: Occasional range-diff residuals for CPP14 vs tree-sitter-cpp node extents.
    bucket: RangeDiff

  # --- C# (Roslyn vs tree-sitter-c-sharp) ---
  - id: csharp-cast-paren
    language: csharp
    backend: roslyn
    pattern_id: cast-expr
    category: grammar-boundary
    reason: >
      tree-sitter often treats parenthesized expressions as casts; Roslyn requires a
      cast expression node, so only-ast-grep volume is high for ($T)$E patterns.
    bucket: OnlyAstGrep

  - id: csharp-block-brace-shape
    language: csharp
    backend: roslyn
    category: grammar-boundary
    reason: >
      Block / statement patterns with braces (if/while/for/foreach/using/lock/public method)
      match under Roslyn but often miss or differ under tree-sitter-c-sharp pattern shapes.
    bucket: OnlyAg4

  - id: csharp-identifier-granularity
    language: csharp
    backend: roslyn
    pattern_id: kind-identifier
    category: grammar-boundary
    reason: >
      tree-sitter `identifier` covers more token sites than Roslyn `identifier_name`
      (even with alias); expect large only-ast-grep plus occasional range-diff.
    bucket: OnlyAstGrep

  - id: csharp-identifier-range
    language: csharp
    backend: roslyn
    pattern_id: kind-identifier
    category: grammar-boundary
    reason: Occasional range-diff on identifier spans between Roslyn and tree-sitter.
    bucket: RangeDiff

  - id: csharp-call-metavar
    language: csharp
    backend: roslyn
    category: grammar-boundary
    reason: >
      Invocation / member-access CST shape differs (argument lists, generic type args,
      extension-method receivers), producing metavar-diff and only-* for call patterns.
    bucket: MetaVarDiff

  - id: csharp-residual-only-ast-grep
    language: csharp
    backend: roslyn
    category: grammar-boundary
    reason: >
      Residual only-ast-grep after Roslyn kind aliases; attributed to tree-sitter-c-sharp
      vs Roslyn CST (casts, awaits, lambdas, typeof/nameof, declarations, composite inside).
    bucket: OnlyAstGrep

  - id: csharp-residual-only-ag4
    language: csharp
    backend: roslyn
    category: grammar-boundary
    reason: >
      Residual only-ag4 from Roslyn shapes that tree-sitter does not surface the same way
      (block statements, public methods, is-patterns, equals/ToString receivers).
    bucket: OnlyAg4

  - id: csharp-residual-metavar
    language: csharp
    backend: roslyn
    category: grammar-boundary
    reason: Residual metavar-diff from Roslyn vs tree-sitter-c-sharp capture extents.
    bucket: MetaVarDiff

  - id: csharp-residual-range
    language: csharp
    backend: roslyn
    category: grammar-boundary
    reason: Residual range-diff from Roslyn vs tree-sitter-c-sharp node extents.
    bucket: RangeDiff

  # --- Python (ANTLR Python3 vs tree-sitter-python) ---
  - id: python-indent-blocks
    language: python
    category: grammar-boundary
    reason: >
      Indent-sensitive suite patterns (if/else/while/for/with/try/def/class) match under
      tree-sitter-python but often miss under ANTLR Python3 INDENT/DEDENT pattern shapes.
    bucket: OnlyAstGrep

  - id: python-call-shape
    language: python
    category: grammar-boundary
    reason: >
      Call / attribute-call CST shape differs (argument lists, starred args, keyword args),
      producing only-ast-grep and metavar-diff for $F($$$ARGS) and $X.$Y($$$ARGS).
    bucket: OnlyAstGrep

  - id: python-call-metavar
    language: python
    category: grammar-boundary
    reason: >
      Metavar capture extents differ for calls, imports, and attribute access between
      tree-sitter-python and ANTLR Python3.
    bucket: MetaVarDiff

  - id: python-residual-only-ast-grep
    language: python
    backend: antlr
    category: grammar-boundary
    reason: >
      Residual only-ast-grep (None literals, assignments, imports, list comps, returns)
      from tree-sitter-python vs ANTLR Python3 CST boundaries.
    bucket: OnlyAstGrep

  - id: python-residual-only-ag4
    language: python
    backend: antlr
    category: grammar-boundary
    reason: >
      Residual only-ag4 from ANTLR Python3 shapes that tree-sitter does not surface the
      same way (occasional call / import wrapping).
    bucket: OnlyAg4

  - id: python-residual-metavar
    language: python
    backend: antlr
    category: grammar-boundary
    reason: Residual metavar-diff from ANTLR Python3 vs tree-sitter-python capture extents.
    bucket: MetaVarDiff

  - id: python-residual-range
    language: python
    backend: antlr
    category: grammar-boundary
    reason: Residual range-diff from ANTLR Python3 vs tree-sitter-python node extents.
    bucket: RangeDiff

  # --- tree-sitter backend: matcher residuals vs upstream (same grammar family) ---
  - id: ts-java-metavar-matcher
    language: java
    backend: tree-sitter
    category: matcher
    reason: >
      After emitting $$$ as per-node multi arrays (ast-grep shape), residual metavar-diff
      remains on try-catch / a few block bodies where child partitioning still differs.
    bucket: MetaVarDiff

  - id: ts-java-only-ast-grep-matcher
    language: java
    backend: tree-sitter
    category: matcher
    reason: >
      Residual only-ast-grep after Smart trailing-skip and multi-JSON alignment
      (switch-block pattern roots, try-catch edges) vs upstream.
    bucket: OnlyAstGrep

  - id: ts-java-only-ag4-matcher
    language: java
    backend: tree-sitter
    category: matcher
    reason: >
      Residual only-ag4 from intentional broader matching (enhanced-for, lambda-arrow /
      lambda-block, static import, static-init) vs upstream.
    bucket: OnlyAg4

  - id: ts-java-range-matcher
    language: java
    backend: tree-sitter
    category: matcher
    reason: Occasional range-diff from pattern-root descent differences vs upstream.
    bucket: RangeDiff

  - id: ts-cpp-metavar-matcher
    language: cpp
    backend: tree-sitter
    category: matcher
    reason: Metavar capture extents differ for calls / members under ag4 vs upstream.
    bucket: MetaVarDiff

  - id: ts-cpp-only-ast-grep-matcher
    language: cpp
    backend: tree-sitter
    category: matcher
    reason: >
      Residual only-ast-grep after #include metavar and statement-context fixes
      (if/namespace bodies and a few quote-includes).
    bucket: OnlyAstGrep

  - id: ts-cpp-only-ag4-matcher
    language: cpp
    backend: tree-sitter
    category: matcher
    reason: Residual only-ag4 from ag4 call / delete / sizeof matching differences.
    bucket: OnlyAg4

  - id: ts-cpp-range-matcher
    language: cpp
    backend: tree-sitter
    category: matcher
    reason: Occasional range-diff residuals under tree-sitter-cpp.
    bucket: RangeDiff

  - id: ts-python-metavar-matcher
    language: python
    backend: tree-sitter
    category: matcher
    reason: Metavar capture extents differ for calls / defs / if-suites vs upstream.
    bucket: MetaVarDiff

  - id: ts-python-only-ast-grep-matcher
    language: python
