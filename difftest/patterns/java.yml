# ast-grep / ag4 differential patterns (Java). No kind-based rules.
language: java
rules:
  # --- calls / $$$ ---
  - id: call-foo
    rule:
      pattern: foo($$$ARGS)
  - id: call-any
    rule:
      pattern: $F($$$ARGS)
  - id: qualified-call
    rule:
      pattern: $X.$Y($$$ARGS)
  - id: chained-call
    rule:
      pattern: $X.$Y($A).$Z($$$ARGS)
  - id: this-call
    rule:
      pattern: this($$$ARGS)
  - id: super-call
    rule:
      pattern: super($$$ARGS)
  - id: println
    rule:
      pattern: System.out.println($A)
  - id: println-multi
    rule:
      pattern: System.out.println($$$ARGS)
  - id: require-non-null
    rule:
      pattern: Objects.requireNonNull($A)
  - id: string-format
    rule:
      pattern: String.format($FMT, $$$ARGS)
  - id: equals-call
    rule:
      pattern: $_.equals($OTHER)
  - id: hash-code
    rule:
      pattern: $_.hashCode()
  - id: to-string
    rule:
      pattern: $_.toString()
  - id: value-of
    rule:
      pattern: $T.valueOf($A)
  - id: wildcard-arg
    rule:
      pattern: bar($_)
  - id: optional-of
    rule:
      pattern: Optional.of($A)
  - id: optional-of-nullable
    rule:
      pattern: Optional.ofNullable($A)
  - id: collections-empty
    rule:
      pattern: Collections.emptyList()
  - id: assert-true
    rule:
      pattern: assertTrue($A)
  - id: assert-equals
    rule:
      pattern: assertEquals($E, $A)

  # --- new / cast / instanceof ---
  - id: new-instance
    rule:
      pattern: new $T($$$ARGS)
  - id: new-array
    rule:
      pattern: new $T[$N]
  - id: cast-expr
    rule:
      pattern: ($T) $E
  - id: instanceof-check
    rule:
      pattern: $EXPR instanceof $TYPE

  # --- statements / blocks ---
  - id: if-block
    rule:
      pattern: if ($C) { $$$B }
  - id: if-else-block
    rule:
      pattern: if ($C) { $$$T } else { $$$E }
  - id: while-loop
    rule:
      pattern: while ($C) { $$$BODY }
  - id: for-loop
    rule:
      pattern: for ($$$INIT; $C; $$$UPDATE) { $$$BODY }
  - id: enhanced-for
    rule:
      pattern: "for ($T $V : $ITER) { $$$BODY }"
  - id: try-catch
    rule:
      pattern: try { $$$TRY } catch ($E $N) { $$$HANDLER }
  - id: try-finally
    rule:
      pattern: try { $$$TRY } finally { $$$FIN }
  - id: return-expr
    rule:
      pattern: return $E;
  - id: return-void
    rule:
      pattern: return;
  - id: throw-expr
    rule:
      pattern: throw $E;
  - id: assignment
    rule:
      pattern: $VAR = $VAL;
  - id: plus-assign
    rule:
      pattern: $VAR += $VAL;
  - id: break-stmt
    rule:
      pattern: break;
  - id: continue-stmt
    rule:
      pattern: continue;

  # --- declarations / members ---
  - id: class-body
    rule:
      pattern: class $N { $$$BODY }
  - id: public-method
    rule:
      pattern: public $TYPE $NAME($$$PARAMS) { $$$BODY }
  - id: private-field
    rule:
      pattern: private $TYPE $NAME;
  - id: import-type
    rule:
      pattern: import $PKG.$TYPE;
  - id: package-decl
    rule:
      pattern: package $PKG;
  - id: override-annotation
    rule:
      pattern: "@Override"
  - id: null-literal
    rule:
      pattern: "null"
  - id: ternary
    rule:
      pattern: "$C ? $T : $E"
  - id: lambda-arrow
    rule:
      pattern: ($P) -> $BODY
  - id: method-ref
    rule:
      pattern: "$T::$M"
  - id: switch-block
    rule:
      pattern: "switch ($X) { $$$C }"
  - id: yield-stmt
    rule:
      pattern: "yield $E;"
  - id: record-decl
    rule:
      pattern: "record $N($$$P) { $$$B }"
  - id: try-with-resources
    rule:
      pattern: "try ($R) { $$$B }"
  - id: synchronized-block
    rule:
      pattern: "synchronized ($L) { $$$B }"
  - id: do-while
    rule:
      pattern: "do { $$$B } while ($C);"
  - id: var-local
    rule:
      pattern: "var $X = $E;"
  - id: lambda-block
    rule:
      pattern: "$A -> { $$$B }"
  - id: suppress-warnings
    rule:
      pattern: "@SuppressWarnings($$$A)"
  - id: static-init
    rule:
      pattern: "static { $$$B }"
  - id: assert-stmt
    rule:
      pattern: "assert $C;"

  # --- composite rules (no kind) ---
  - id: println-inside-method
    rule:
      all:
        - pattern: System.out.println($A)
        - inside:
            pattern: $RET $NAME($$$PARAMS) { $$$BODY }
  - id: throw-not-npe
    rule:
      all:
        - pattern: throw $E;
        - not:
            pattern: throw new NullPointerException($$$ARGS);
  - id: equals-or-hashcode
    rule:
      any:
        - pattern: $_.equals($OTHER)
        - pattern: $_.hashCode()
  - id: new-has-string-arg
    rule:
      all:
        - pattern: new $T($$$ARGS)
        - has:
            pattern: '"$S"'
  - id: return-precedes-throw
    rule:
      all:
        - pattern: return $E;
        - precedes:
            pattern: throw $X;
            stopBy: neighbor
  - id: assign-follows-decl
    rule:
      all:
        - pattern: $VAR = $VAL;
        - follows:
            pattern: $TYPE $VAR;
            stopBy: neighbor

  # --- rewrites ---
  - id: rewrite-println
    rule:
      pattern: System.out.println($A)
    rewrite: LOG.info(String.valueOf($A))
  - id: rewrite-require-non-null
    rule:
      pattern: Objects.requireNonNull($A)
    rewrite: Objects.requireNonNull($A, "required")
  - id: rewrite-empty-list
    rule:
      pattern: Collections.emptyList()
    rewrite: List.of()
