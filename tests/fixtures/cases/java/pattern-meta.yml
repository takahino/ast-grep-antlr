language: java
cases:
  - id: single-arg-no-list
    pattern: "foo($A)"
    source: |
      class T { void m() { foo(1, 2, 3); } }
    reject:
      - "foo(1, 2, 3)"
  - id: single-arg-one
    pattern: "foo($A)"
    source: |
      class T { void m() { foo(1); } }
    expect:
      - text: "foo(1)"
        meta:
          A: "1"
  - id: method-body-multi
    pattern: "void $M() { $$$BODY }"
    source: |
      class T { void run() { int x = 1; foo(x); } }
    expect:
      - text: "void run() { int x = 1; foo(x); }"
        meta:
          M: "run"
  - id: if-block-multi
    pattern: "if ($C) { $$$B }"
    source: |
      class T { void m() { if (ok) { doWork(); } } }
    expect:
      - text: "if (ok) { doWork(); }"
  - id: class-body-multi
    pattern: "class $N { $$$BODY }"
    source: |
      class T { int x; void m() {} }
    expect:
      - text: "class T { int x; void m() {} }"
        meta:
          N: "T"
  - id: typed-expression
    pattern: "${A:primary}"
    source: |
      class T { void m() { x; y(); } }
    expect:
      - text: "x"
    reject:
      - "y()"
  - id: try-catch-block
    pattern: "try { $$$TRY } catch ($E $N) { $$$HANDLER }"
    source: |
      class T { void m() { try { a(); } catch (Exception e) { b(); } } }
    expect:
      - text: "try { a(); } catch (Exception e) { b(); }"
  - id: public-method-decl
    pattern: "public $RET $NAME($$$ARGS) { $$$BODY }"
    source: |
      class T { public int run(int x) { return x; } }
    expect:
      - text: "public int run(int x) { return x; }"
  - id: while-loop-block
    pattern: "while ($C) { $$$BODY }"
    source: |
      class T { void m() { while (ok) { work(); } } }
    expect:
      - text: "while (ok) { work(); }"
  - id: for-loop-block
    pattern: "for ($$$INIT; $C; $$$UPDATE) { $$$BODY }"
    source: |
      class T { void m() { for (int i = 0; i < 3; i++) { work(); } } }
    expect:
      - text: "for (int i = 0; i < 3; i++) { work(); }"
